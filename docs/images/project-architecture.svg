<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">STM32 Mastermind Game Architecture</title>
  <desc id="desc">Block diagram showing USART input, EXTI button, TIM2 timer, STM32F401 game logic, LCD, seven-segment display, LEDs, buzzer, Flash, and RAM.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .card { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; }
      .core { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; rx: 12; }
      .io { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .mem { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .pin { font: 13px Consolas, monospace; fill: #4b5563; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="560"/>
  <text class="title" x="550" y="48" text-anchor="middle">STM32 Mastermind Bomb Defusal Game</text>
  <text class="small" x="550" y="75" text-anchor="middle">USART guesses, LCD feedback, seven-segment countdown, EXTI rescue button, LEDs, buzzer, and TIM2 timing</text>

  <rect class="core" x="390" y="150" width="320" height="210"/>
  <text class="label" x="550" y="190" text-anchor="middle">STM32F401VCTx</text>
  <text class="small" x="550" y="222" text-anchor="middle">Game State Machine</text>
  <text class="small" x="550" y="248" text-anchor="middle">Mastermind Compare Logic</text>
  <text class="small" x="550" y="274" text-anchor="middle">Interrupt Handlers</text>
  <text class="pin" x="550" y="305" text-anchor="middle">WAIT_START / PLAYING / GAMEOVER</text>

  <rect class="io" x="70" y="125" width="220" height="92"/>
  <text class="label" x="180" y="158" text-anchor="middle">Serial Terminal</text>
  <text class="small" x="180" y="184" text-anchor="middle">Start: S or s</text>
  <text class="pin" x="180" y="205" text-anchor="middle">USART1 PA9 / PA10</text>

  <rect class="io" x="70" y="290" width="220" height="92"/>
  <text class="label" x="180" y="323" text-anchor="middle">Rescue Button</text>
  <text class="small" x="180" y="349" text-anchor="middle">+15s, then +5s</text>
  <text class="pin" x="180" y="370" text-anchor="middle">EXTI0 PE0</text>

  <rect class="card" x="70" y="440" width="220" height="70"/>
  <text class="label" x="180" y="470" text-anchor="middle">TIM2</text>
  <text class="small" x="180" y="496" text-anchor="middle">Countdown and refresh</text>

  <rect class="io" x="810" y="105" width="230" height="78"/>
  <text class="label" x="925" y="137" text-anchor="middle">LCD Display</text>
  <text class="small" x="925" y="162" text-anchor="middle">*, +, -, YOU WON, BOOM</text>

  <rect class="io" x="810" y="215" width="230" height="78"/>
  <text class="label" x="925" y="247" text-anchor="middle">7-Segment Display</text>
  <text class="small" x="925" y="272" text-anchor="middle">Remaining time</text>

  <rect class="io" x="810" y="325" width="230" height="78"/>
  <text class="label" x="925" y="357" text-anchor="middle">LEDs and Buzzer</text>
  <text class="small" x="925" y="382" text-anchor="middle">Status and timeout alarm</text>

  <rect class="mem" x="395" y="425" width="140" height="78"/>
  <text class="label" x="465" y="457" text-anchor="middle">Flash</text>
  <text class="small" x="465" y="482" text-anchor="middle">Firmware code</text>

  <rect class="mem" x="565" y="425" width="140" height="78"/>
  <text class="label" x="635" y="457" text-anchor="middle">RAM</text>
  <text class="small" x="635" y="482" text-anchor="middle">Game variables</text>

  <path class="arrow" d="M 290 171 L 380 215"/>
  <text class="pin" x="335" y="175" text-anchor="middle">RX IRQ</text>

  <path class="arrow" d="M 290 336 L 380 300"/>
  <text class="pin" x="335" y="326" text-anchor="middle">EXTI IRQ</text>

  <path class="arrow" d="M 290 475 L 470 365"/>
  <text class="pin" x="370" y="430" text-anchor="middle">Timer IRQ</text>

  <path class="arrow" d="M 720 195 L 810 144"/>
  <path class="arrow" d="M 720 254 L 810 254"/>
  <path class="arrow" d="M 720 312 L 810 364"/>

  <path class="dash" d="M 465 425 L 500 365"/>
  <path class="dash" d="M 635 425 L 600 365"/>

  <text class="small" x="550" y="535" text-anchor="middle">Main source: firmware/Mastermind_Game/Core/Src/main.c</text>
</svg>
